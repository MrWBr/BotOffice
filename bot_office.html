<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>🏢 Bot Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Baloo+2:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Moldura — discreta, não compete com a cena */
  --frame-bg:#12141a;
  --frame-panel:#1b2130;
  --frame-border:#2a3142;
  --frame-text:#8a93ab;
  --frame-text-dim:#565f78;

  /* Acentos semânticos — suavizados, sem gritar */
  --ok:#7ed957;
  --work:#ffb454;
  --err:#ff6b6b;
  --meet:#b083f0;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--frame-bg);
  overflow:hidden;
  font-family:'Baloo 2',"Arial",sans-serif;
  height:100vh;
  user-select:none;
}

/* ===== JANELA / DIORAMA ===== */
#vp{
  position:absolute; top:34px; left:0; right:200px; bottom:0;
  overflow:hidden; background:#0a0c12;
  display:flex; align-items:center; justify-content:center;
  padding:14px;
}
#windowFrame{
  position:relative; width:100%; height:100%;
  border-radius:14px; border:4px solid var(--frame-border);
  box-shadow: inset 0 0 0 2px #000a, 0 0 40px rgba(255,180,84,.06);
  overflow:hidden; background:#000;
}
#windowFrame::after{
  /* reflexo sutil de vidro — reforça a metáfora de "janela" */
  content:''; position:absolute; top:0; left:0; right:0; height:35%;
  background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,0));
  pointer-events:none; z-index:2;
}
#cv{ position:absolute; top:0; left:0; }

/* ===== TOPBAR ===== */
#topbar{
  position:fixed; top:0; left:0; right:0; height:34px;
  background:linear-gradient(180deg,var(--frame-panel),var(--frame-bg));
  border-bottom:2px solid var(--frame-border);
  display:flex; align-items:center; padding:0 12px; z-index:600; gap:8px;
}
.rn{ font-family:'Silkscreen',monospace; color:#fff; font-size:11px; letter-spacing:1px; }
.ri{ color:var(--frame-text-dim); font-size:9px; }
.tb-sep{ width:1px; height:18px; background:var(--frame-border); margin:0 4px; }
.tb-btn{
  display:flex; align-items:center; gap:3px; padding:4px 10px; border-radius:6px; border:1px solid;
  font-size:10px; font-weight:700; cursor:pointer; background:transparent; font-family:'Baloo 2',sans-serif;
  transition:transform .12s, filter .12s;
}
.tb-btn:hover{ transform:translateY(-1px); filter:brightness(1.15); }
.tb-btn:active{ transform:translateY(0); }
.tb-go{ border-color:var(--ok); color:var(--ok); }
.tb-st{ border-color:var(--err); color:var(--err); }
.tb-cfg{ border-color:var(--work); color:var(--work); }
.tb-pills{ display:flex; gap:6px; margin-left:auto; }
.pill{ padding:3px 9px; border-radius:10px; font-size:9px; font-weight:600; background:rgba(255,255,255,.04); }
.pill-a{ color:var(--ok); border:1px solid rgba(126,217,87,.3); }
.pill-i{ color:var(--work); border:1px solid rgba(255,180,84,.3); }
.pill-e{ color:var(--err); border:1px solid rgba(255,107,107,.3); }
.zb{ background:transparent; border:1px solid var(--frame-border); color:var(--frame-text); padding:2px 7px; border-radius:4px; cursor:pointer; font-size:11px; font-weight:bold; }
.zl{ color:var(--frame-text-dim); font-size:9px; font-family:monospace; min-width:30px; text-align:center; }
.clk{ color:var(--frame-text); font-size:11px; font-family:monospace; margin-left:4px; }

/* ===== PAINEL DE ATIVIDADE ===== */
#panel{
  position:fixed; right:0; top:34px; bottom:0; width:200px;
  background:linear-gradient(180deg,var(--frame-panel),var(--frame-bg));
  border-left:2px solid var(--frame-border);
  z-index:500; display:flex; flex-direction:column;
}
.ph{ padding:8px; border-bottom:1px solid var(--frame-border); color:var(--frame-text); font-size:10px; font-weight:700; letter-spacing:.5px; }
.pb{ flex:1; overflow-y:auto; padding:6px; }
.pe{
  padding:6px 8px; margin-bottom:4px; border-radius:6px; font-size:11px; color:#d5d9e6;
  background:rgba(255,255,255,.03); border-left:3px solid var(--frame-border);
  animation:li .25s ease-out;
}
.pe.ok{ border-left-color:var(--ok); }
.pe.err{ border-left-color:var(--err); }
.pe.soc{ border-left-color:var(--work); }
@keyframes li{ from{opacity:0; transform:translateX(6px);} to{opacity:1; transform:translateX(0);} }
.pt{ color:var(--frame-text-dim); font-family:monospace; margin-right:4px; font-size:9px; }
.ps{ font-weight:700; margin-right:4px; }

/* ===== MODAL DE CONFIG (agora com cara de "crachá") ===== */
.modal-bg{ position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:800; display:none; align-items:center; justify-content:center; }
.modal-bg.vis{ display:flex; }
.modal{ background:var(--frame-panel); border:2px solid var(--frame-border); border-radius:12px; padding:16px; width:400px; max-height:80vh; overflow-y:auto; }
.modal h3{ font-family:'Silkscreen',monospace; color:#fff; font-size:12px; margin-bottom:12px; border-bottom:1px solid var(--frame-border); padding-bottom:8px; }
.modal .row{ display:flex; gap:10px; align-items:center; padding:8px 6px; border-bottom:1px solid #0d1a3380; }
.modal .bot-em{ font-size:18px; width:26px; text-align:center; }
.modal .bot-nm{ color:#fff; font-size:11px; font-weight:700; flex:1; }
.modal select{ background:#0d1a33; border:1px solid var(--frame-border); color:#fff; padding:4px 7px; border-radius:5px; font-size:10px; width:84px; }
.modal .close-btn{ margin-top:12px; width:100%; padding:8px; background:var(--work); color:#1a1200; border:none; border-radius:6px; cursor:pointer; font-weight:700; font-size:11px; }
::-webkit-scrollbar{ width:4px; }
::-webkit-scrollbar-thumb{ background:var(--frame-border); border-radius:3px; }
</style>
</head>
<body>

<div id="topbar">
  <span class="rn">🏢 BOT OFFICE</span>
  <span class="ri">seus bots, trabalhando</span>
  <div class="tb-sep"></div>
  <button class="tb-btn tb-go" onclick="STATE.running=true">▶ Start</button>
  <button class="tb-btn tb-st" onclick="STATE.running=false">■ Stop</button>
  <button class="tb-btn tb-cfg" onclick="openCfg()">⚙ Config</button>
  <div class="tb-sep"></div>
  <button class="zb" onclick="zm(-0.1)">−</button>
  <span class="zl" id="zLbl">135%</span>
  <button class="zb" onclick="zm(0.1)">+</button>
  <div class="tb-pills">
    <span class="pill pill-a" id="st-a">● 0 ativos</span>
    <span class="pill pill-i" id="st-i">● 0 ociosos</span>
    <span class="pill pill-e" id="st-e">● 0 erros</span>
  </div>
  <span class="clk" id="clk">--:--</span>
</div>

<div class="modal-bg" id="cfgM">
  <div class="modal">
    <h3>⚙ Configuração dos Bots</h3>
    <div id="cfgL"></div>
    <button class="close-btn" onclick="closeCfg()">Fechar</button>
  </div>
</div>

<div id="panel">
  <div class="ph">💬 Atividade</div>
  <div class="pb" id="logP"></div>
</div>

<!-- CANVAS agora dentro de uma "janela" com moldura e reflexo de vidro -->
<div id="vp">
  <div id="windowFrame">
    <canvas id="cv" style="position:absolute"></canvas>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/engine.js"></script>
<script src="js/furniture.js"></script>
<script src="js/screens.js"></script>
<script src="js/character.js"></script>
<script src="js/walk.js"></script>
<script src="js/simulation.js"></script>
<script src="js/ui.js"></script>

</body>
</html>
